name: Deploy site to GitHub Pages

# Builds the Quartz site in site/ (which reads the wiki via the site/content
# symlink) and publishes it to GitHub Pages. The site is live, and deploys are
# triggered manually so Pages visibility can be confirmed before each publish.
# Serving Pages from a private repository requires a paid GitHub plan.

on:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Build Quartz site
        run: npx quartz build
      - name: Sanitize public output
        run: node scripts/sanitize-public.mjs
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/public

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
